# Builds the Learner Lab images (ADR-027) and pushes them to GitHub Container Registry.
# The packages inherit the public repo's visibility, so ECS pulls without credentials. If one is
# private: GitHub → Packages → dawwen-* → Package settings → Change visibility → Public.
name: Lab images

on:
  push:
    branches: [test/learner-lab]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/lab-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lab-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lower case)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dawwen-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - name: Build (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: smoke:${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Start the Node apps with no configuration: they must get far enough to reject the missing
      # env vars. A module-loading failure means the bundle or the runtime install is broken.
      - name: Smoke test (modules load)
        if: matrix.app != 'web'
        run: |
          out=$(timeout 60 docker run --rm smoke:${{ matrix.app }} 2>&1 || true)
          echo "$out" | tail -20
          if echo "$out" | grep -qE "Dynamic require|ERR_MODULE_NOT_FOUND|Cannot find (module|package)|ERR_REQUIRE_ESM"; then
            echo "::error::${{ matrix.app }} image cannot load its modules"; exit 1
          fi

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:lab
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
