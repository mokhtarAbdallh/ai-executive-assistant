services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dawwen-postgres
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: dawwen
      POSTGRES_PASSWORD: dawwen_dev_pw
    ports:
      # Override when 5432 is taken: DAWWEN_PG_PORT=55433 docker compose up -d (and DB_PORT in .env)
      - "${DAWWEN_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawwen -d meetings"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    container_name: dawwen-localstack
    ports:
      - "${DAWWEN_LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=eu-central-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      # Healthy only after the ready-hook created the bucket, queues and S3 notification.
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"state\": \"SUCCESSFUL\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
